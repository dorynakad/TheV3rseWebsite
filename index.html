    <script>
        let clickCount = 0;
        let clickTimer;
        const requiredClicks = 10;
        const resetTime = 2000; // Reset count if no click for 2 seconds

        document.addEventListener('click', (e) => {
            clickCount++;
            clearTimeout(clickTimer);

            const warning = document.getElementById('warning-message');

            if (clickCount === 8) {
                if (warning) warning.style.display = 'block';
            }

            if (clickCount >= requiredClicks) {
                if (warning) warning.style.display = 'none';
                playEasterEgg();
                clickCount = 0;
            } else {
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                    if (warning) warning.style.display = 'none';
                }, resetTime);
            }
        });

        function playEasterEgg() {
            const overlay = document.getElementById('video-overlay');
            const video = document.getElementById('loading-video');
            const errorMessage = document.getElementById('error-message');

            if (overlay && video && errorMessage) {
                errorMessage.style.display = 'none';

                video.style.display = 'block';
                overlay.style.display = 'flex';
                video.currentTime = 0;
                video.play().catch(err => console.error("Video play failed:", err));
            }
        }

        const videoElement = document.getElementById('loading-video');
        if (videoElement) {
            videoElement.addEventListener('ended', () => {
                // Hide video, show error message
                videoElement.style.display = 'none';
                const errorMessage = document.getElementById('error-message');

                if (errorMessage) {
                    errorMessage.style.display = 'block';

                    // Close overlay after 6 seconds
                    setTimeout(() => {
                        const overlay = document.getElementById('video-overlay');
                        if (overlay) overlay.style.display = 'none';
                    }, 6000);
                }
            });
        }

        // Glitch Image Sequence Logic - Scroll Bound
        const glitchImg = document.getElementById('glitch-img');
        const totalFrames = 80; // 000 to 079

        // Preload images for smoother scrolling
        const images = [];
        for (let i = 0; i < totalFrames; i++) {
            const img = new Image();
            const frameStr = String(i).padStart(3, '0');
            img.src = `glitchcut_000/glitchcut_${frameStr}.jpg`;
            images.push(img.src);
        }

        window.addEventListener('scroll', () => {
            if (!glitchImg) return;

            const scrollTop = window.scrollY;
            const docHeight = document.body.scrollHeight - window.innerHeight;
            const scrollPercent = scrollTop / docHeight;

            // Map percentage to frame index
            let frameIndex = Math.floor(scrollPercent * (totalFrames - 1));

            // Clamp value
            if (frameIndex < 0) frameIndex = 0;
            if (frameIndex >= totalFrames) frameIndex = totalFrames - 1;

            const frameStr = String(frameIndex).padStart(3, '0');
            glitchImg.src = `glitchcut_000/glitchcut_${frameStr}.jpg`;
        });
    </script>
